name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'Journal.UI/**'
      - '.github/workflows/frontend-static-deploy.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]
    paths:
      - 'Journal.UI/**'
      - '.github/workflows/frontend-static-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

env:
  NODE_VERSION: '22.x'

jobs:
  deploy-development:
    runs-on: ubuntu-latest
    name: Deploy to Development
    if: github.event_name == 'push' || inputs.environment == 'development'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Journal.UI/package-lock.json

      - name: Install dependencies
        working-directory: Journal.UI
        run: npm ci

      - name: Build frontend
        working-directory: Journal.UI
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://inside-journal-api-development.azurewebsites.net/api
          EXPO_PUBLIC_API_BASE_URL: https://inside-journal-api-development.azurewebsites.net

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: "upload"
          app_location: "Journal.UI/dist"
          skip_app_build: true
          skip_api_build: true

      - name: Deployment summary
        run: |
          echo "### Frontend deployed to development" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://kind-sand-09f05e10f.6.azurestaticapps.net" >> $GITHUB_STEP_SUMMARY
          echo "**API:** https://inside-journal-api-development.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Journal.UI/package-lock.json

      - name: Install dependencies
        working-directory: Journal.UI
        run: npm ci

      - name: Build frontend
        working-directory: Journal.UI
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://inside-journal-api.azurewebsites.net/api
          EXPO_PUBLIC_API_BASE_URL: https://inside-journal-api.azurewebsites.net

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "Journal.UI/dist"
          skip_app_build: true
          skip_api_build: true

      - name: Deployment summary
        run: |
          echo "### Frontend deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://polite-island-0c8b5cb0f.5.azurestaticapps.net" >> $GITHUB_STEP_SUMMARY
          echo "**API:** https://inside-journal-api.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy PR Preview
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Journal.UI/package-lock.json

      - name: Install dependencies
        if: github.event.action != 'closed'
        working-directory: Journal.UI
        run: npm ci

      - name: Build frontend
        if: github.event.action != 'closed'
        working-directory: Journal.UI
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://inside-journal-api-development.azurewebsites.net/api
          EXPO_PUBLIC_API_BASE_URL: https://inside-journal-api-development.azurewebsites.net

      - name: Deploy PR Preview to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: ${{ github.event.action == 'closed' && 'close' || 'upload' }}
          app_location: "Journal.UI/dist"
          skip_app_build: true
          skip_api_build: true
