name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'journal.client/**'
      - '.github/workflows/frontend-static-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

env:
  NODE_VERSION: '22.x'

jobs:
  deploy-development:
    runs-on: ubuntu-latest
    name: Deploy to Development
    if: github.event_name == 'push' || inputs.environment == 'development'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: journal.client/package-lock.json

      - name: Install dependencies
        working-directory: journal.client
        run: npm ci

      - name: Build frontend
        working-directory: journal.client
        run: npm run build
        env:
          VITE_API_URL: https://inside-journal-api-development.azurewebsites.net/api
          VITE_API_BASE_URL: https://inside-journal-api-development.azurewebsites.net
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.VITE_APPLICATIONINSIGHTS_CONNECTION_STRING_DEV }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: "upload"
          app_location: "journal.client/dist"
          skip_app_build: true
          skip_api_build: true

      - name: Deployment summary
        run: |
          echo "### Frontend deployed to development" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://kind-sand-09f05e10f.6.azurestaticapps.net" >> $GITHUB_STEP_SUMMARY
          echo "**API:** https://inside-journal-api-development.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: journal.client/package-lock.json

      - name: Install dependencies
        working-directory: journal.client
        run: npm ci

      - name: Build frontend
        working-directory: journal.client
        run: npm run build
        env:
          VITE_API_URL: https://inside-journal-api.azurewebsites.net/api
          VITE_API_BASE_URL: https://inside-journal-api.azurewebsites.net
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.VITE_APPLICATIONINSIGHTS_CONNECTION_STRING }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "journal.client/dist"
          skip_app_build: true
          skip_api_build: true

      - name: Deployment summary
        run: |
          echo "### Frontend deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://polite-island-0c8b5cb0f.5.azurestaticapps.net" >> $GITHUB_STEP_SUMMARY
          echo "**API:** https://inside-journal-api.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
